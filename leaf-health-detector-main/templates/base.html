```html
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="theme-color" content="#14532d">
    <meta name="description" content="AI-powered plant disease detection using deep learning.">

    <title>{% block pagetitle %}Leaf Health AI{% endblock pagetitle %}</title>

    <!-- PWA -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Project CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --primary: #166534;
            --primary-dark: #14532d;
            --accent: #22c55e;
            --page-bg: #f5f8f5;
            --text: #17251b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Inter', sans-serif;
            background: var(--page-bg);
            color: var(--text);
        }

        /* Navbar */
        .main-navbar {
            background: var(--primary-dark);
            padding: 14px 0;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }

        .navbar-brand {
            font-weight: 800;
            letter-spacing: -0.5px;
            color: white !important;
        }

        .navbar-brand i {
            color: #4ade80;
            margin-right: 8px;
        }

        .navbar-nav .nav-link {
            color: #e5f5e9 !important;
            font-weight: 500;
            margin: 0 5px;
            padding: 9px 13px !important;
            border-radius: 8px;
            transition: 0.2s ease;
        }

        .navbar-nav .nav-link:hover {
            background: rgba(255, 255, 255, 0.12);
            color: white !important;
        }

        /* Main content */
        main {
            flex: 1;
            width: 100%;
        }

        .rounded-lg {
            border-radius: 18px;
        }

        .file-upload input[type="file"] {
            display: none;
        }

        label {
            cursor: pointer;
        }

        #file-chosen {
            margin-left: 8px;
            font-size: 14px;
            color: #526356;
        }

        /* Buttons */
        .btn-success {
            background: var(--primary);
            border-color: var(--primary);
        }

        .btn-success:hover {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
        }

        /* Footer */
        .footer-basic {
            margin-top: 55px;
            padding: 32px 16px 20px;
            background: #102d1b;
            color: #e5f5e9;
        }

        .footer-social {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 18px;
            margin-bottom: 22px;
        }

        .footer-social a {
            color: #e5f5e9;
            font-size: 21px;
            transition: 0.2s;
        }

        .footer-social a:hover {
            color: #4ade80;
            transform: translateY(-2px);
        }

        .footer-basic ul {
            padding: 0;
            margin: 0 0 15px;
            list-style: none;
            text-align: center;
        }

        .footer-basic li {
            display: inline-block;
            margin: 5px 10px;
        }

        .footer-basic ul a {
            color: #d1e7d7;
            text-decoration: none;
            font-size: 14px;
        }

        .footer-basic ul a:hover {
            color: white;
        }

        .copyright {
            margin: 0;
            text-align: center;
            color: #a9c2b0;
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .navbar-nav .nav-link {
                margin: 3px 0;
            }

            .footer-basic {
                margin-top: 30px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark main-navbar">
        <div class="container">

            <a class="navbar-brand" href="/">
                <i class="fa-solid fa-leaf"></i> Leaf Health AI
            </a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNavDropdown"
                    aria-controls="navbarNavDropdown"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/index">AI Engine</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/market">Supplements</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/contact">Contact</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <!-- Page content -->
    <main>
        {% block body %}
        {% endblock body %}
    </main>

    <!-- Footer -->
    <footer class="footer-basic">
        <div class="container">

            <div class="footer-social">
                <!-- Replace these URLs with your own profiles -->

                <a href="https://github.com/"
                   target="_blank" rel="noopener noreferrer"
                   aria-label="GitHub">
                    <i class="fa-brands fa-github"></i>
                </a>

                <a href="https://www.linkedin.com/"
                   target="_blank" rel="noopener noreferrer"
                   aria-label="LinkedIn">
                    <i class="fa-brands fa-linkedin"></i>
                </a>
            </div>

            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/index">AI Engine</a></li>
                <li><a href="/market">Supplements</a></li>
                <li><a href="/contact">Contact</a></li>
            </ul>

            <p class="copyright">
                Leaf Health AI | Plant Disease Detection using Deep Learning
            </p>

        </div>
    </footer>

    <!-- Bootstrap 5 JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Service Worker -->
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register(
                    "{{ url_for('static', filename='sw.js') }}"
                ).catch(function (error) {
                    console.log("Service Worker registration failed:", error);
                });
            });
        }
    </script>

</body>
</html>
```
